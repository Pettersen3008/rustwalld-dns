name: Appliance comparison
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Warm queries per scenario
        type: number
        default: 100000
      rules:
        description: Exact filter dataset size
        type: number
        default: 100000
      rounds:
        description: Counterbalanced product rounds
        type: number
        default: 3
permissions:
  contents: read
jobs:
  compare:
    # Dedicated Linux cgroup-v2/Docker host with distinct physical CPUs 2/4/6.
    runs-on: [self-hosted, linux, x64, dns-comparison]
    timeout-minutes: 45
    env:
      COMPARISON_ITERATIONS: ${{ inputs.iterations }}
      COMPARISON_RULES: ${{ inputs.rules }}
      COMPARISON_ROUNDS: ${{ inputs.rounds }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          mkdir -p target/comparison
          python3 scripts/compare-appliances.py --iterations "$COMPARISON_ITERATIONS" --rules "$COMPARISON_RULES" --rounds "$COMPARISON_ROUNDS" --output target/comparison/report.json > target/comparison-run.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appliance-comparison
          path: |
            target/comparison/report.json
            target/comparison-run.log
