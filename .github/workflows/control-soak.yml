name: Control-plane soak
on:
  workflow_dispatch:
    inputs:
      phase_ms:
        description: Minimum traffic duration per phase (100–60000 ms)
        default: '8000'
        required: true
      cycles:
        description: Recovery cycles (1–16; four phases each)
        default: '10'
        required: true
      rules:
        description: Synthetic exact rules (1–500000)
        default: '100000'
        required: true
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p rustwalld-dns --example control_soak
      # Build production separately so dev-dependency features do not select it.
      - run: cargo build --release --locked -p rustwalld-dns
      - name: Repeated recovery under DNS traffic
        shell: bash
        env:
          SOAK_PHASE_MS: ${{ inputs.phase_ms }}
          SOAK_CYCLES: ${{ inputs.cycles }}
          SOAK_RULES: ${{ inputs.rules }}
        run: target/release/examples/control_soak --binary target/release/rustwalld-dns --phase-ms "$SOAK_PHASE_MS" --cycles "$SOAK_CYCLES" --rules "$SOAK_RULES" --output target/control-soak.json 2>&1 | tee target/control-soak.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-plane-soak-evidence
          path: |
            target/control-soak.json
            target/control-soak.log
