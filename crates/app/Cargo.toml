[package]
name = "rustwalld-dns"
description = "Standalone local DNS policy appliance with management console"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
parallel-compilation = ["rustwalld-dns-runtime/parallel-compilation", "rustwalld-dns-filter/parallel"]

[dependencies]
rustwalld-dns-runtime = { path = "../runtime", version = "0.1" }
rustwalld-dns-resolver = { path = "../resolver", version = "0.1" }
rustwalld-dns-core = { path = "../dns-core", version = "0.1" }
rustwalld-dns-policy = { path = "../policy", version = "0.1" }
rustwalld-dns-filter = { path = "../filtering", version = "0.1" }
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json = "1"
axum = {version="0.8.9",features=["http2"]}
toml = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
ring = "0.17"
tower-http = { version = "0.6", features = ["fs"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
ipnet = "2"
http = "1"
url = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
base64 = "0.23"
argon2 = {version="0.6.0",features=["zeroize"]}
zeroize = {version="1.9.1",features=["serde"]}
data-encoding = "2.11.1"
arc-swap.workspace = true
hickory-proto.workspace = true
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
webpki-roots = "1"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled", "backup", "limits"] }


[dev-dependencies]
httpdate = "1.0.3"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
reqwest = { version = "0.13", default-features = false, features = ["json","rustls","http2"] }
rcgen = "0.14"
h2 = "0.4"
http = "1"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }

[[example]]
name = "encrypted_resilience"
test = true

[[example]]
name = "resilience"
test = true

[[example]]
name = "control_soak"
test = true

[[example]]
name = "wire_compare"
test = true

[[example]]
name = "remote_soak"
test = true
