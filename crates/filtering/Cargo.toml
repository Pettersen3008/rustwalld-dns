[package]
name = "rustwalld-dns-filter"
description = "Immutable exact and suffix DNS filtering with rule provenance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dns", "security", "filtering"]
categories = ["network-programming"]
include = ["Cargo.toml", "README.md", "LICENSE-*", "src/**", "examples/**", "tests/**", "benches/**"]

[lints]
workspace = true

[features]
parallel = ["dep:rayon"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
idna = "1"
hashbrown.workspace = true
foldhash = "0.2"
rayon = { version = "1.12", optional = true }

[dev-dependencies]
criterion = "0.8"
serde_json = "1"

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "compilation"
harness = false
required-features = ["parallel"]

[[example]]
name = "compile_compare"
required-features = ["parallel"]
