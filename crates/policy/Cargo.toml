[package]
name = "rustwalld-dns-policy"
description = "Assertion-gated DNS policy compilation and client selection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dns", "security", "filtering"]
categories = ["network-programming"]
include = ["Cargo.toml", "README.md", "LICENSE-*", "src/**", "examples/**", "tests/**", "benches/**"]

[lints]
workspace = true

[features]
parallel = ["rustwalld-dns-filter/parallel"]

[dependencies]
rustwalld-dns-filter = { path = "../filtering", version = "0.1" }
rustwalld-dns-resolver = { path = "../resolver", version = "0.1" }
hickory-proto.workspace = true
serde.workspace = true
thiserror.workspace = true
ipnet = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
