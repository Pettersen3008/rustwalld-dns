[package]
name = "rustwalld-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
hickory-proto = "0.26.3"
rustwalld-dns-filter = { path = "../crates/filtering",version="0.1", features = ["parallel"] }
rustwalld-dns-resolver = { path = "../crates/resolver",version="0.1" }
rustwalld-dns-policy = { path = "../crates/policy",version="0.1" }
rustwalld-dns-runtime = { path = "../crates/runtime",version="0.1" }
rustwalld-dns-core = { path = "../crates/dns-core",version="0.1" }
rustwalld-dns = { path = "../crates/app",version="0.1" }
http = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "soak_record"
path = "fuzz_targets/soak_record.rs"
test = false
doc = false
bench = false

