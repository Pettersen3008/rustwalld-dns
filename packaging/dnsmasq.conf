# INACTIVE EXAMPLE: edit addresses/interface and disable other DHCP on this LAN
# before explicitly enabling this in your distribution's dnsmasq configuration.
# Maintained dnsmasq owns DHCP; Rustwall owns DNS.
port=0
interface=eth0
bind-interfaces
no-hosts
no-resolv
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,12h
dhcp-option=option:router,192.168.1.1
dhcp-option=option:dns-server,192.168.1.2
dhcp-option=option:domain-search,home.arpa
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
# Optional reservations: dhcp-host=aa:bb:cc:dd:ee:ff,nas,192.168.1.20,infinite
# Install these matching local A/AAAA records in Rustwall's Local DNS editor.
