# Optional distro unbound.conf.d snippet. Keep the distribution's root trust
# anchor configuration: this snippet does not download or replace trust anchors.
server:
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    do-udp: yes
    do-tcp: yes
    edns-buffer-size: 1232
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    cache-min-ttl: 0
    cache-max-ttl: 3600
    prefetch: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    # Rustwalld preserves client CD; enforce validation even for those clients.
    ignore-cd-flag: yes
    hide-identity: yes
    hide-version: yes
    verbosity: 0
    log-queries: no
    log-replies: no
