[package]
name = "runtime-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
parallel = ["rustwalld-dns-runtime/parallel-compilation", "dep:rustwalld-dns-filter"]

[dependencies]
rustwalld-dns-filter = { path = "../../../crates/filtering", features = ["parallel"], optional = true }
rustwalld-dns-core = { path = "../../../crates/dns-core" }
rustwalld-dns-runtime = { path = "../../../crates/runtime" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
hickory-proto = "0.26.3"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
